name: busca
on:
  push:
    branches: [main]
    paths: ["packages/search/**", "eval/perguntas/**", ".github/workflows/busca.yml"]
  workflow_dispatch:
    inputs:
      modelo:
        description: "Modelo de embeddings (transformers.js)"
        default: "Xenova/multilingual-e5-small"
permissions:
  contents: read
  issues: write
jobs:
  hibrida:
    runs-on: ubuntu-latest
    env:
      EMBED_MODELO: ${{ inputs.modelo || 'Xenova/multilingual-e5-small' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ETL
        run: pnpm --filter @reforma/search etl
      - name: Cache do modelo de embeddings
        uses: actions/cache@v4
        with:
          path: node_modules/.pnpm/@huggingface+transformers*/node_modules/@huggingface/transformers/.cache
          key: emb-${{ inputs.modelo || 'Xenova/multilingual-e5-small' }}-q8-v1
      - name: Gera vetores
        run: pnpm --filter @reforma/search vetores
      - name: Avalia (léxica × híbrida, nos dois conjuntos)
        run: |
          cd packages/search
          for f in busca busca-nao-visto; do
            pnpm -s avaliar "../../eval/perguntas/$f.yaml" || true
            pnpm -s avaliar "../../eval/perguntas/$f.yaml" --hibrida || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: busca-dados-e-resultados
          path: |
            data/
            eval/resultados/
      - name: Relatório na issue #5
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### 🤖 Avaliação da busca (\`$EMBED_MODELO\`) — $(date -u +%F' '%H:%MZ) · [execução](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo; cat data/vetores.json 2>/dev/null | head -5 | sed 's/^/    /'; echo
            for m in eval/resultados/*.md; do echo; echo "<details><summary>$(head -1 "$m" | sed 's/^# //')</summary>"; echo; tail -n +2 "$m"; echo; echo "</details>"; done
            echo; echo "#### Resumo"; echo; echo "| Conjunto | Modo | Top-1 | Top-3 | Top-5 | ms/consulta |"; echo "|---|---|---|---|---|---|"
            for j in eval/resultados/*.json; do jq -r '.resumo | "| \(.arquivo) | \(.modo) | \(.top1*100|floor)% | \(.top3*100|floor)% | \(.top5*100|floor)% | \(.msMedio*10|floor/10) |"' "$j"; done
          } > /tmp/comentario.md
          gh issue comment 5 --repo "${{ github.repository }}" --body-file /tmp/comentario.md
